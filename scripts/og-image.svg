<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="35%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Decorative dice/dots pattern (subtle, top-right) -->
  <g opacity="0.08" fill="#ffffff">
    <circle cx="950" cy="80" r="8"/>
    <circle cx="1050" cy="120" r="8"/>
    <circle cx="950" cy="160" r="8"/>
    <circle cx="1050" cy="200" r="8"/>
    <circle cx="1100" cy="80" r="6"/>
    <circle cx="900" cy="200" r="6"/>
    <circle cx="1150" cy="180" r="5"/>
  </g>

  <!-- Logo mark — stylized "T" in a rounded square (simplified from logo.svg) -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="#ffffff" opacity="0.95"/>
    <rect x="20" y="20" width="40" height="8" rx="4" fill="#1e3a8a"/>
    <rect x="36" y="20" width="8" height="40" rx="4" fill="#1e3a8a"/>
  </g>

  <!-- Brand name -->
  <text x="180" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#ffffff">
    TableTop Prime
  </text>

  <!-- Main headline -->
  <text x="80" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-2">
    Run board game
  </text>
  <text x="80" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-2">
    tournaments the
  </text>
  <text x="80" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#10b981" letter-spacing="-2">
    modern way.
  </text>

  <!-- Subtitle -->
  <text x="80" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#94a3b8">
    Pairings · Dual-score verification · Judge dispatch · CSV export
  </text>

  <!-- URL bar at bottom -->
  <rect x="0" y="590" width="1200" height="40" fill="#000000" opacity="0.3"/>
  <text x="80" y="616" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#cbd5e1">
    tabletopprime.com
  </text>

  <!-- Decorative accent — three colored dots representing players -->
  <g transform="translate(1020, 540)">
    <circle cx="0" cy="0" r="14" fill="#f59e0b"/>
    <circle cx="36" cy="0" r="14" fill="#ef4444"/>
    <circle cx="72" cy="0" r="14" fill="#8b5cf6"/>
  </g>
</svg>
